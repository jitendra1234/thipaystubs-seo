# Runs when SEO text or blog posts are saved (from GitHub or from https://thipaystubs.com/admin).
# 1. Checks seo.json is valid JSON.
# 2. Starts the website deploy (paystub-generator's "Deploy to AWS" workflow), which downloads
#    this repo, runs the full SEO + blog checks, and only goes live if everything passes.
name: Publish SEO text

on:
  push:
    branches: [main]
    paths: [seo.json, 'blog/**', 'blog-media/**']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check seo.json is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('seo.json','utf8')); console.log('seo.json is valid JSON')"

      - name: Deploy the website (AWS)
        env:
          TOKEN: ${{ secrets.MAIN_REPO_DEPLOY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "MAIN_REPO_DEPLOY_TOKEN secret is not set"; exit 1; fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/jitendra1234/paystub-generator/actions/workflows/deploy-aws.yml/dispatches \
            -d '{"ref":"main"}'
          echo "Deploy started — changes are live in about 5 minutes if the checks pass."

